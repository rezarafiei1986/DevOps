services:

  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka

    hostname: kafka

    ports:
      - "9092:9092"
      - "29092:29092"

    environment:
      # KRaft configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Development configuration
      KAFKA_NUM_PARTITIONS: 3

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

    restart: unless-stopped

  python-producer:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: python-producer

    env_file:
      - .env

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    volumes:
      - ./data:/app/data

    depends_on:
      kafka:
        condition: service_healthy

    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    hostname: seaweedfs

    command: >
      mini
      -dir=/data
      -ip=seaweedfs
      -s3
      -volume.max=0

    ports:
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"
      - "8181:8181"

    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: secret
      S3_BUCKET: warehouse
      S3_TABLE_BUCKET: iceberg-warehouse

    volumes:
      - seaweedfs-data:/data

    restart: unless-stopped




  kafka-connect:
    image: apache/kafka:4.1.1
    container_name: kafka-connect
    hostname: kafka-connect
    ports:
      - "8083:8083"
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx768m"
    volumes:
      - ./connect/config/worker.properties:/etc/kafka-connect/worker.properties:ro
      - ./connect/plugins:/opt/kafka/plugins:ro
    command:
      - /opt/kafka/bin/connect-distributed.sh
      - /etc/kafka-connect/worker.properties
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 1400m
    restart: unless-stopped


volumes:
  kafka-data:
  seaweedfs-data:
